{% extends 'base.html' %}{% block title %}Edit customer{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow">CUSTOMERS</p><h1>Edit customer</h1><p class="muted">Update this customer’s contact details.</p></div><a class="btn secondary" href="{{ url_for('customers') }}">Back to customers</a></div><section class="panel form-panel"><form method="post" class="form-stack narrow"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Name<input name="name" required value="{{ customer.name }}"></label><label>Phone<input name="phone" value="{{ customer.phone or '' }}"></label><label>Email<input type="email" name="email" value="{{ customer.email or '' }}"></label><label>Address<textarea name="address" rows="4">{{ customer.address or '' }}</textarea></label><button class="btn primary">Save changes</button></form></section>{% endblock %}
