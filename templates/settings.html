{% extends 'base.html' %}{% block title %}Settings{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow">WORKSPACE</p><h1>Settings</h1><p class="muted">Shape BillSmart around your shop.</p></div><a class="btn secondary" href="{{ url_for('backup_data') }}"><i class="bi bi-download"></i> Backup data</a></div><section class="panel form-panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-section"><h3>Shop profile</h3><p class="muted">This information appears on your invoices.</p></div><label>Shop name<input name="shop_name" required value="{{ setting.shop_name }}"></label><label>Shop email<input type="email" name="shop_email" value="{{ setting.shop_email }}"></label><label>Phone<input name="phone" value="{{ setting.phone }}"></label><label>Currency<input name="currency" maxlength="4" value="{{ setting.currency }}"></label><label class="full-span">Address<textarea name="address" rows="3">{{ setting.address }}</textarea></label><div class="form-section"><h3>Appearance</h3><p class="muted">Choose the default theme for this workspace.</p></div><label>Default theme<select name="theme"><option value="light" {% if setting.theme=='light' %}selected{% endif %}>Light</option><option value="dark" {% if setting.theme=='dark' %}selected{% endif %}>Dark</option></select></label><div class="form-actions full-span"><button class="btn primary">Save settings <i class="bi bi-check2"></i></button></div></form></section>{% endblock %}
