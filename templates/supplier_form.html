{% extends 'base.html' %}{% block title %}Edit supplier{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow">SUPPLIERS</p><h1>Edit supplier</h1><p class="muted">Update this supplier’s contact details.</p></div><a class="btn secondary" href="{{ url_for('suppliers') }}">Back to suppliers</a></div><section class="panel form-panel"><form method="post" class="form-stack narrow"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Name<input name="name" required value="{{ supplier.name }}"></label><label>Phone<input name="phone" value="{{ supplier.phone or '' }}"></label><label>Email<input type="email" name="email" value="{{ supplier.email or '' }}"></label><label>Address<textarea name="address" rows="4">{{ supplier.address or '' }}</textarea></label><button class="btn primary">Save changes</button></form></section>{% endblock %}
